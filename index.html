<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f8f5f1"/><title>My Workspace — Personal Planner</title><link rel="stylesheet" href="styles.css"/></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><strong>my workspace</strong><small>your personal command centre</small></div></div><div class="nav-label">WORKSPACE</div><nav id="nav"></nav><div class="side-bottom"><button id="exportBtn" class="side-tool">↓ Export backup</button><button id="importBtn" class="side-tool">↑ Import backup</button><input id="importFile" type="file" accept="application/json" hidden/><small>Saved locally in this browser.<br/>Export regularly to keep a backup.</small></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="dateLabel"></div><h1 id="pageTitle">Good to see you ✨</h1><p class="subtitle" id="pageSubtitle">One place for everything you're working towards.</p></div><div class="header-actions"><button class="btn ghost" id="newProjectBtn">＋ Project</button><button class="btn primary" id="newTaskBtn">＋ Add task</button></div></header><div id="page"></div></main></div>
<dialog id="taskDialog"><form method="dialog" id="taskForm"><h2 id="taskDialogTitle">New task</h2><label>Task name<input name="title" required maxlength="160" placeholder="What needs to get done?"/></label><div class="two"><label>Area<select name="area" id="taskArea"></select></label><label>Project<select name="project" id="taskProject"></select></label></div><div class="two"><label>Due date<input type="date" name="due"/></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label></div><div class="dialog-actions"><button class="btn ghost" value="cancel" type="button" data-close="taskDialog">Cancel</button><button class="btn primary" type="submit">Save task</button></div></form></dialog>
<dialog id="projectDialog"><form method="dialog" id="projectForm"><h2 id="projectDialogTitle">New project</h2><label>Project name<input name="name" required maxlength="120" placeholder="e.g. Master's applications"/></label><label>Area<select name="area" id="projectArea"></select></label><label>Description<textarea name="description" rows="3" placeholder="What is this project about?"></textarea></label><label>Target date<input name="due" type="date"/></label><div class="dialog-actions"><button class="btn ghost" value="cancel" type="button" data-close="projectDialog">Cancel</button><button class="btn primary" type="submit">Save project</button></div></form></dialog>
<script src="app.js"></script></body></html>
